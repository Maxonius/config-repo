server.port=8084
spring.application.name=api-gateway

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ===== ROUTE 0: User Service =====
spring.cloud.gateway.server.webmvc.routes[0].id=user-service-route
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0].name=Path
spring.cloud.gateway.server.webmvc.routes[0].predicates[0].args.pattern=/api/users/**

spring.cloud.gateway.server.webmvc.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.name=userServiceBreaker
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.fallbackUri=forward:/fallback/users

# ===== ROUTE 1: Notification Service =====
spring.cloud.gateway.server.webmvc.routes[1].id=notification-service-route
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0].name=Path
spring.cloud.gateway.server.webmvc.routes[1].predicates[0].args.pattern=/api/notifications/**

spring.cloud.gateway.server.webmvc.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.name=notificationServiceBreaker
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.fallbackUri=forward:/fallback/notifications

# ===== Circuit Breaker Instances =====
resilience4j.circuitbreaker.instances.userServiceBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.userServiceBreaker.minimumNumberOfCalls=1
resilience4j.circuitbreaker.instances.userServiceBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.userServiceBreaker.waitDurationInOpenState=5s

resilience4j.circuitbreaker.instances.notificationServiceBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.notificationServiceBreaker.minimumNumberOfCalls=1
resilience4j.circuitbreaker.instances.notificationServiceBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.notificationServiceBreaker.waitDurationInOpenState=5s